<!doctype html>
<html data-pp-test="rapide" data-ao-source="outlook">
<head>
<meta charset="utf-8">
<title>Courrier - Outlook (fausse page de l'audit « langues et versions »)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px "Segoe UI", system-ui, sans-serif; background: #f5f5f5; color: #242424; }
  button { font: inherit; cursor: pointer; border: 1px solid #d1d1d1; background: #fff; border-radius: 4px; padding: 4px 8px; margin: 2px; }
  .entete { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; background: #0f6cbd; color: #fff; }
  .entete .logo { font-weight: 700; }
  .entete .recherche { width: 380px; padding: 6px 8px; border-radius: 4px; border: 0; }
  .outils-haut { margin-left: auto; margin-right: 400px; }
  .milieu { display: flex; }
  .rail { width: 48px; display: flex; flex-direction: column; background: #ebebeb; }
  .principal { flex: 1; min-width: 0; }
  .ruban { background: #fff; border-bottom: 1px solid #ddd; padding: 2px 8px; margin-right: 400px; }
  .onglets .onglet[aria-selected="true"] { border-bottom: 2px solid #0f6cbd; font-weight: 600; }
  .commandes { display: flex; flex-wrap: wrap; align-items: center; }
  .brouillons { margin-right: 400px; }
  .barre-app { background: #fff; padding: 4px 8px; margin-right: 400px; }
  .bas { display: flex; min-height: 640px; }
  .liste { width: 300px; background: #fff; border-right: 1px solid #ddd; }
  .message-liste { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #eee; }
  .message-liste .texte-liste { display: flex; flex-direction: column; min-width: 0; }
  .message-liste .apercu { color: #616161; font-size: 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #c7e0f4; display: grid; place-items: center; font-size: 12px; flex: none; }
  .lecture { flex: 1; min-width: 0; padding: 12px; margin-right: 400px; }
  .redaction { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; }
  .tete-redaction { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .ligne-dest { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #eee; min-height: 34px; }
  .champ-dest { flex: 1; min-height: 24px; padding: 3px; outline: none; }
  .fui-Input { flex: 1; display: flex; align-items: center; }
  .cache-fluent { width: 2px; height: 2px; border: 0; padding: 0; opacity: .01; }
  .ms-BasePicker { flex: 1; }
  .ms-BasePicker-text { display: flex; flex-wrap: wrap; align-items: center; }
  .ms-SelectionZone { display: flex; flex-wrap: wrap; }
  .ms-BasePicker-input { flex: 1; min-width: 120px; border: 0; padding: 4px; outline: none; }
  .ms-PickerPersona-container { display: inline-flex; align-items: center; background: #f0f0f0; border-radius: 12px; padding: 1px 6px; margin: 2px; }
  ._EType_RECIPIENT_ENTITY { display: inline-block; background: #f0f0f0; border-radius: 12px; padding: 1px 6px; margin: 1px 2px; }
  .ligne-objet input { width: 100%; padding: 6px 4px; border: 0; border-bottom: 1px solid #eee; outline: none; font: inherit; }
  .corps { min-height: 260px; padding: 8px 4px; outline: none; }
  .callout { position: fixed; z-index: 1000; width: 380px; background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 16px rgba(0,0,0,.2); border-radius: 6px; }
  .option-sugg, .ms-Suggestions-item { padding: 6px 8px; cursor: pointer; }
  .fui-Persona { display: flex; gap: 6px; align-items: center; }
  .fui-Persona__secondaryText { color: #616161; font-size: 12px; }
  .plus-resultats, .ms-SearchMore-button { display: block; padding: 6px 8px; color: #0f6cbd; cursor: pointer; }
  .menu-faux { position: fixed; z-index: 1100; background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 16px rgba(0,0,0,.2); display: flex; flex-direction: column; min-width: 220px; }
  .menu-faux .item-menu { text-align: left; border: 0; }
  .sous-menu { border-top: 1px solid #ddd; display: flex; flex-direction: column; }
  .carnet { position: fixed; z-index: 1200; left: 200px; top: 160px; width: 520px; height: 300px; background: #fff; border: 1px solid #888; padding: 16px; }
  .teams { position: fixed; z-index: 500; left: 56px; bottom: 8px; width: 290px; height: 230px; background: #fff; border: 1px solid #bbb; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .teams-saisie { flex: 1; border: 1px solid #ddd; padding: 4px; outline: none; }
  .modale-redaction { position: fixed; z-index: 900; left: 120px; top: 70px; width: 760px; background: #fff; border: 1px solid #888; box-shadow: 0 8px 40px rgba(0,0,0,.35); padding: 8px; }
  [hidden] { display: none !important; }
  /* Mode sombre d'Outlook */
  html.sombre body { background: #1b1a19; color: #f3f2f1; }
  html.sombre .ruban, html.sombre .liste, html.sombre .redaction, html.sombre .callout, html.sombre .menu-faux, html.sombre .barre-app, html.sombre .teams { background: #292827; color: #f3f2f1; border-color: #484644; }
  html.sombre button { background: #323130; color: #f3f2f1; border-color: #605e5c; }
  html.sombre .ligne-objet input, html.sombre .ms-BasePicker-input { background: #292827; color: #f3f2f1; }
  html.sombre .corps.fond-clair { background: #fff; color: #000; }
  /* Fenêtre étroite */
  html.etroit .liste { width: 170px; }
  html.etroit .lecture, html.etroit .ruban, html.etroit .barre-app, html.etroit .brouillons { margin-right: 0; }
  html.etroit .outils-haut { margin-right: 0; }
  html.etroit .entete .recherche { width: 160px; }
</style>
<script src="/__audit/libelles.js"></script>
<script src="/__audit/annuaire.js"></script>
</head>
<body>
<script src="/__audit/outlook-variante.js"></script>
</body>
</html>
